chart-dirs:
  - .
# Glossary requires an external PostgreSQL service absent from the CI cluster.
# Keep lint coverage; restore install coverage when a database fixture exists.
excluded-charts:
  - glossary
debug: true
remote: origin
target-branch: master
chart-repos:
  - bitnami=https://charts.bitnami.com/bitnami
  - stable=https://charts.helm.sh/stable
helm-repo-extra-args:
  - stable=--force-update
